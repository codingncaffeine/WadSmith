name: CI

# Every push to main and every pull request: build the whole solution on Linux and on Windows
# with warnings as errors, and run the unit tests. Tests that need commercial game data run
# locally only; CI uses the free Freedoom data.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    # A hung test ends the job here, not at GitHub's six-hour limit.
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The 3D view draws with windowless OpenGL through EGL; Mesa's software renderer stands in for a GPU.
      - name: Install Mesa's EGL
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libegl-mesa0 libgl1-mesa-dri

      # Freedoom and GZDoom's own data file, pinned by checksum; commercial games are local-only.
      - name: Fetch the free test data
        shell: bash
        run: |
          tools/fetch-test-data.sh "$RUNNER_TEMP/games"
          echo "WADSMITH_TEST_GAMES=$RUNNER_TEMP/games" >> "$GITHUB_ENV"

      - name: Build (warnings are errors)
        run: dotnet build WadSmith.slnx -c Release -warnaserror

      # Every test is named as it passes; one that hangs is stopped after two minutes with a dump.
      - name: Unit tests
        run: dotnet test tests/WadSmith.Tests -c Release --no-build --blame-hang --blame-hang-timeout 2m --logger "console;verbosity=normal" --results-directory TestResults

      - name: Keep the hang dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 7
          if-no-files-found: ignore
